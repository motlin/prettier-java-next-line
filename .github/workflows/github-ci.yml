name: Prettier-java
on: [push, pull_request]
permissions:
  contents: read
jobs:
  tests:
    name: unit tests (node ${{ matrix.node_version }})
    runs-on: ubuntu-latest
    if: "!contains(github.event.head_commit.message, '[ci skip]') && !contains(github.event.head_commit.message, '[skip ci]') && !contains(github.event.pull_request.title, '[skip ci]') && !contains(github.event.pull_request.title, '[ci skip]')"
    strategy:
      matrix:
        node_version:
          - 20.x
          - 22.x
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: actions/setup-node@3235b876344d2a9aa001b8d1453c930bba69e610 # v3.9.1
        with:
          node-version: ${{ matrix.node_version }}
      - uses: actions/setup-java@17f84c3641ba7b8f6deff6309fc4c864478f5d62 # v3.14.1
        with:
          java-version: 17.x
          distribution: zulu
      - name: Install dependencies
        run: yarn
      - name: Run CI
        run: yarn run ci

  e2e-tests:
    name: ${{ matrix.test_repository }} (node ${{ matrix.node_version }})
    runs-on: ubuntu-latest
    if: "!contains(github.event.head_commit.message, '[ci skip]') && !contains(github.event.head_commit.message, '[skip ci]') && !contains(github.event.pull_request.title, '[skip ci]') && !contains(github.event.pull_request.title, '[ci skip]')"
    strategy:
      matrix:
        test_repository:
          - e2e-jhipster1
          - e2e-jhipster2
        node_version: [22.x]
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: actions/setup-node@3235b876344d2a9aa001b8d1453c930bba69e610 # v3.9.1
        with:
          node-version: ${{ matrix.node_version }}
      - uses: actions/setup-java@17f84c3641ba7b8f6deff6309fc4c864478f5d62 # v3.14.1
        with:
          java-version: 21.x
          distribution: zulu
      - name: Install dependencies
        run: yarn
      - name: Build prettier-plugin-java
        run: yarn run build:prettier-plugin-java
      - name: Run e2e tests
        env:
          TEST_REPOSITORY: ${{ matrix.test_repository }}
        run: yarn run test:prettier-plugin-java "test:$TEST_REPOSITORY"
