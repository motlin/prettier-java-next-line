name: 🔬 Pre-release

on:
  push:
    branches:
      - develop
      - next
      - beta
      - alpha

jobs:
  prerelease:
    name: 📦 Pre-release
    runs-on: ubuntu-latest
    if: github.actor != 'dependabot[bot]'
    permissions:
      contents: write
      packages: write
      id-token: write
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: 🔧 Configure Git
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

      - name: 📦 Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: '.mise.toml'
          registry-url: 'https://registry.npmjs.org'
          cache: 'yarn'

      - name: 📚 Install dependencies
        run: yarn install --frozen-lockfile

      - name: 🏗️ Build packages
        run: yarn build

      - name: 🧪 Run tests
        run: yarn test

      - name: 🔍 Run linting
        run: yarn lint

      - name: 📋 Check formatting
        run: yarn format:validate

      - name: 🏷️ Determine pre-release tag
        id: preid
        env:
          BRANCH_NAME: ${{ github.ref_name }}
        run: |
          case "$BRANCH_NAME" in
            develop)
              echo "preid=dev" >> "$GITHUB_OUTPUT"
              ;;
            next)
              echo "preid=next" >> "$GITHUB_OUTPUT"
              ;;
            beta)
              echo "preid=beta" >> "$GITHUB_OUTPUT"
              ;;
            alpha)
              echo "preid=alpha" >> "$GITHUB_OUTPUT"
              ;;
            *)
              echo "preid=canary" >> "$GITHUB_OUTPUT"
              ;;
          esac

      - name: 🔖 Version packages
        run: |
          yarn lerna:version prerelease --preid "$PREID" --yes --no-push
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PREID: ${{ steps.preid.outputs.preid }}

      - name: 📢 Publish to npm with tag
        run: |
          echo "//registry.npmjs.org/:_authToken=${NPM_TOKEN}" >> ~/.npmrc
          yarn lerna publish from-package --dist-tag "$PREID" --yes
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          PREID: ${{ steps.preid.outputs.preid }}

      - name: 📤 Push version tags
        env:
          REF_NAME: ${{ github.ref_name }}
        run: |
          git push --follow-tags origin "$REF_NAME"
