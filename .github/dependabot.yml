version: 2
updates:
  # 📦 Keep npm dependencies up to date
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 10
    groups:
      prettier:
        patterns:
          - "prettier*"
      testing:
        patterns:
          - "*chai*"
          - "*mocha*"
          - "*sinon*"
      linting:
        patterns:
          - "*eslint*"
      types:
        patterns:
          - "@types/*"
    commit-message:
      prefix: "⬆️ deps"
      prefix-development: "⬆️ deps-dev"
    labels:
      - "dependencies"
      - "javascript"

  # 🔧 Keep GitHub Actions up to date
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    commit-message:
      prefix: "⬆️ ci"
    labels:
      - "ci"
      - "github-actions"